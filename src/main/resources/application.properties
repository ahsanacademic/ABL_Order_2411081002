spring.application.name=order
server.port=8083

app.datasource.write.url=jdbc:h2:mem:order_write;DB_CLOSE_DELAY=-1
app.datasource.write.driver-class-name=org.h2.Driver
app.datasource.write.username=${DB_USERNAME:root}
app.datasource.write.password=${DB_PASSWORD:}

app.datasource.read.url=jdbc:h2:mem:order_read;DB_CLOSE_DELAY=-1
app.datasource.read.driver-class-name=org.h2.Driver
app.datasource.read.username=${DB_USERNAME:root}
app.datasource.read.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=DEBUG

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.jwt.secret=${APP_JWT_SECRET}
